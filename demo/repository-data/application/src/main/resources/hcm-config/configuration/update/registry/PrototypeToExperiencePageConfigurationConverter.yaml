definitions:
  config:
    /hippo:configuration/hippo:update/hippo:registry/PrototypeToExperiencePageConfigurationConverter:
      jcr:primaryType: hipposys:updaterinfo
      hipposys:batchsize: 10
      hipposys:description: ''
      hipposys:dryrun: false
      hipposys:loglevel: DEBUG
      hipposys:logtarget: REPOSITORY
      hipposys:parameters: '{"hstConfigurations": "bloomreach, en-au, en-ca, en-de,
        en-gb, en-nz", "defaultXpageDocType":"bloomreach:SEOExperiencePage", "xPageFolder"
        : "xpages", "parseInheritedHstConfiguration": true}'
      hipposys:query: hst:bloomreach/hst:configurations
      hipposys:script: "package org.bloomreach.cms.scripts\r\n\r\nimport org.apache.commons.lang3.StringUtils\r\
        \nimport org.onehippo.repository.update.BaseNodeUpdateVisitor\r\n\r\nimport\
        \ javax.jcr.*\r\nimport java.util.function.Function\r\nimport java.util.stream.Collectors\r\
        \nimport java.util.stream.Stream\r\n\r\n/**\r\n * Convert existing landing\
        \ pages (Prototype Pages) to Experience Pages\r\n * Warning: If a suitable\
        \ prototype page is not found, the script will skip the conversion for that\
        \ hst:page.\r\n *\r\n * XPath:  hst:{projectId}/hst:configurations\r\n *\r\
        \n * Parameters:\r\n *   hstConfigurations (String)     = /hst:{projectId}/hst:configurations/{hstConfiguration}\
        \ comma separated list of HST configurations to process\r\n *   xPageFolder\
        \ (String)           = Root folder for XPages, default is \"xpages\"\r\n *\
        \   defaultXPageDocType (String)   = Default document type for XPages, default\
        \ is \"xpagemixin\"\r\n *   parseInheritedHstConfiguration = Whether to parse\
        \ inherited HST configuration, default is false\r\n * Example: {\"hstConfigurations\"\
        : \"bloomreach, en-au, en-ca, en-de, en-gb, en-nz\", \"defaultXpageDocType\"\
        :\"bloomreach:SEOExperiencePage\", \"xPageFolder\" : \"xpages\", \"parseInheritedHstConfiguration\"\
        : true}\r\n */\r\nclass PrototypeToExperiencePageConfigurationConverter extends\
        \ BaseNodeUpdateVisitor {\r\n\r\n    String hstConfigurations\r\n    String\
        \ xPageFolder\r\n    String defaultXpageDocType\r\n    Boolean parseInheritedHstConfiguration\r\
        \n\r\n    // Initializing parameters from the script\r\n    void initialize(Session\
        \ session) {\r\n        hstConfigurations = (String) parametersMap.get(\"\
        hstConfigurations\")\r\n        xPageFolder = (String) parametersMap.getOrDefault(\"\
        xPageFolder\", \"xpages\")\r\n        defaultXpageDocType = (String) parametersMap.get(\"\
        defaultXpageDocType\")\r\n        parseInheritedHstConfiguration = (Boolean)\
        \ parametersMap.getOrDefault(\"parseInheritedHstConfiguration\", false)\r\n\
        \        if (StringUtils.isEmpty(hstConfigurations)) {\r\n            log.error(\"\
        hstConfigurations property is empty\")\r\n            throw new RuntimeException(\"\
        hstConfigurations property is empty\")\r\n        }\r\n        if (StringUtils.isEmpty(defaultXpageDocType))\
        \ {\r\n            log.error(\"defaultXpageDocType property is empty\")\r\n\
        \            throw new RuntimeException(\"defaultXpageDocType property is\
        \ empty\")\r\n        }\r\n        log.info(\"Starting the LandingPage2XPageConversion\
        \ script with configuration:\" +\r\n                \"\\nhstConfiguration=\"\
        \ + hstConfigurations +\r\n                \"\\nxPageFolder=\" + xPageFolder\
        \ +\r\n                \"\\ndefaultXpageDocType=\" + defaultXpageDocType +\r\
        \n                \"\\nparseInheritedHstConfiguration=\" + parseInheritedHstConfiguration);\r\
        \n    }\r\n\r\n    @Override\r\n    boolean doUpdate(final Node node) throws\
        \ RepositoryException {\r\n        if (node.isNodeType(\"hst:configurations\"\
        )) {\r\n            // Parse hstConfigurations into a list of trimmed configuration\
        \ names\r\n            List<String> configList = hstConfigurations.split(\"\
        ,\").collect { it.trim() }\r\n            log.info(\"Processing HST configurations:\
        \ \" + configList)\r\n\r\n            // Process each configuration in the\
        \ list\r\n            configList.forEach { hstConfiguration ->\r\n       \
        \         log.info(\"Processing configuration: \" + hstConfiguration)\r\n\
        \                if (node.hasNode(hstConfiguration)) {\r\n               \
        \     final NodeIterator it = node.getNodes(hstConfiguration)\r\n        \
        \            while (it.hasNext()) {\r\n                        final Node\
        \ configuration = it.nextNode()\r\n                        if (configuration.isNodeType(\"\
        hst:configuration\")) {\r\n                            log.info(\"Initializing\
        \ the in-memory channel configurations model\")\r\n                      \
        \      HstConfiguration hstConfig = new HstConfiguration(configuration)\r\n\
        \                            log.debug(\"Full hstConfig to be processed: \\\
        nprotoTypePages={}\\nworkspace={}\\nsiteMap={}\\nxPages={}\\nname={}\\npath={}\\\
        nhst={}\\nhstConfigNode={}\\npages={}\\nsession={}\",\r\n                \
        \                    hstConfig.protoTypePages,\r\n                       \
        \             hstConfig.workspace,\r\n                                   \
        \ hstConfig.siteMap,\r\n                                    hstConfig.xPages,\r\
        \n                                    hstConfig.name,\r\n                \
        \                    hstConfig.path,\r\n                                 \
        \   hstConfig.hst,\r\n                                    hstConfig.hstConfigNode,\r\
        \n                                    hstConfig.pages,\r\n               \
        \                     hstConfig.session\r\n                            );\r\
        \n                            hstConfig.startConversion()\r\n            \
        \            }\r\n                    }\r\n                }\r\n         \
        \   }\r\n        }\r\n        return true\r\n    }\r\n\r\n    // Undoing updates\
        \ is not supported in this script\r\n    @Override\r\n    boolean undoUpdate(final\
        \ Node node) throws RepositoryException, UnsupportedOperationException {\r\
        \n        return false\r\n    }\r\n\r\n    interface ToNode {\r\n        void\
        \ toNode(Node container) throws RepositoryException\r\n    }\r\n\r\n    private\
        \ class HstConfiguration {\r\n        static ProtoTypePages protoTypePages\r\
        \n        final Workspace workspace\r\n        final SiteMap siteMap\r\n \
        \       final XPages xPages\r\n        final String name\r\n        final\
        \ String path\r\n        final Node hst\r\n        final Node hstConfigNode\r\
        \n        final Pages pages\r\n        final Session session\r\n\r\n     \
        \   HstConfiguration(Node hstConfiguration) throws RepositoryException {\r\
        \n            // Define variables based on either the hstConfiguration node\
        \ or the inherited configuration\r\n            protoTypePages = new ProtoTypePages()\r\
        \n\r\n            // Contribute to variables with inherited configurations\
        \ if applicable\r\n            if (parseInheritedHstConfiguration) {\r\n \
        \               if (hstConfiguration.hasProperty(\"hst:inheritsfrom\")) {\r\
        \n                    final Property inheritsFrom = hstConfiguration.getProperty(\"\
        hst:inheritsfrom\")\r\n                    if (inheritsFrom) {\r\n       \
        \                 Value[] inheritedHstConfig = inheritsFrom.getValues();\r\
        \n                        for (Value value : inheritedHstConfig) {\r\n   \
        \                         String inheritedHst = value.getString();\r\n   \
        \                         // Clean inheritedHst to remove leading '../', './',\
        \ and '/'\r\n                            String cleanedInheritedHst = inheritedHst.replaceAll(/^(?:\\\
        .\\.\\/|\\.\\/|\\/)+/, \"\")\r\n                            Node inheritedNode\
        \ = hstConfiguration.getParent().getNode(cleanedInheritedHst)\r\n        \
        \                    if (inheritedNode != null && inheritedNode.isNodeType(\"\
        hst:configuration\")) {\r\n                                if (inheritedNode.hasNode(\"\
        hst:prototypepages\")) {\r\n                                    protoTypePages.contribute(inheritedNode.getNode(\"\
        hst:prototypepages\"))\r\n                                }\r\n          \
        \                  } else {\r\n                                log.warn(\"\
        Inherited HST configuration node does not exist or is not of type 'hst:configuration':\
        \ \" + cleanedInheritedHst)\r\n                            }\r\n         \
        \               }\r\n                    }\r\n                }\r\n      \
        \      }\r\n\r\n            // Set variables based on the current hstConfiguration\
        \ node\r\n            if (hstConfiguration.hasNode(\"hst:prototypepages\"\
        )) {\r\n                protoTypePages.contribute(hstConfiguration.getNode(\"\
        hst:prototypepages\"))\r\n            }\r\n            this.hstConfigNode\
        \ = hstConfiguration\r\n            this.session = hstConfigNode.getSession()\r\
        \n            this.name = hstConfiguration.getName()\r\n            this.path\
        \ = hstConfiguration.getPath()\r\n            this.hst = hstConfiguration.getParent().getParent()\r\
        \n            this.workspace = hstConfiguration.hasNode(\"hst:workspace\"\
        ) ? new Workspace(this, hstConfiguration.getNode(\"hst:workspace\")) : null\r\
        \n            if (!hstConfiguration.hasNode(\"hst:sitemap\")) {\r\n      \
        \          hstConfiguration.addNode(\"hst:sitemap\", \"hst:sitemap\")\r\n\
        \            }\r\n            this.siteMap = new SiteMap(this, hstConfiguration.getNode(\"\
        hst:sitemap\"))\r\n            this.xPages = getOrCreateXPages(hstConfiguration)\r\
        \n            this.pages = hstConfiguration.hasNode(\"hst:pages\") ? new Pages(this,\
        \ hstConfiguration.getNode(\"hst:pages\")) : null\r\n        }\r\n\r\n   \
        \     private XPages getOrCreateXPages(final Node hstConfiguration) throws\
        \ RepositoryException {\r\n            if (hstConfiguration.hasNode(\"hst:xpages\"\
        )) {\r\n                return new XPages(hstConfiguration.getNode(\"hst:xpages\"\
        ))\r\n            } else {\r\n                final Node xPageContainer =\
        \ hstConfiguration.addNode(\"hst:xpages\", \"hst:xpages\")\r\n           \
        \     return new XPages(xPageContainer)\r\n            }\r\n        }\r\n\r\
        \n        Node getSiteBaseNode() throws RepositoryException {\r\n        \
        \    String hstSite = \"hst:sites/\" + name\r\n            if (hst.hasNode(hstSite))\
        \ {\r\n                final Node site = hst.getNode(hstSite)\r\n        \
        \        if (site.hasProperty(\"hst:content\")) {\r\n                    return\
        \ site.getProperty(\"hst:content\").getNode()\r\n                }\r\n   \
        \         }\r\n            return null\r\n        }\r\n\r\n        void startConversion()\
        \ throws RepositoryException {\r\n            log.info(\"Starting conversion\
        \ of prototype page configuration to XPages for \" + path)\r\n           \
        \ removeHstPreviewConfiguration()\r\n\r\n            convertPrototypeToXPageTemplateNodes()\r\
        \n\r\n            createSitemapWildCards()\r\n\r\n            log.info(\"\
        End conversion of landing pages to XPages for \" + path)\r\n        }\r\n\r\
        \n        void removeHstPreviewConfiguration() {\r\n            log.info(\"\
        Step 0 - Remove the preview configuration if it exists\")\r\n            final\
        \ Node configurations = hstConfigNode.getParent()\r\n            if (configurations.hasNode(hstConfigNode.getName()\
        \ + \"-preview\")) {\r\n                log.info(\"Step 0 - Removing the preview\
        \ configuration, before we start the conversion\")\r\n                configurations.getNode(hstConfigNode.getName()\
        \ + \"-preview\").remove()\r\n            }\r\n            log.info(\"Step\
        \ 0 - end\")\r\n        }\r\n\r\n        void convertPrototypeToXPageTemplateNodes()\
        \ {\r\n            log.info(\"Step 1 - Convert prototype pages to xpages\"\
        )\r\n            try {\r\n                // Check if protoTypePages exists\
        \ and has valid prototype pages\r\n                if (protoTypePages != null\
        \ && protoTypePages.getProtoTypePages() != null) {\r\n                   \
        \ final Map<String, XPage> xpagesFromPrototypePages = protoTypePages.getProtoTypePages().stream()\r\
        \n                            .filter({ protoTypePage -> protoTypePage !=\
        \ null }) // Filter out null prototype pages\r\n                         \
        \   .map({ protoTypePage ->\r\n                                try {\r\n \
        \                                   // Skip if an XPage with the same name\
        \ already exists in the repository\r\n                                   \
        \ if (xPages != null && xPages.getXPages() != null && xPages.getXPages().containsKey(protoTypePage.name))\
        \ {\r\n                                        log.info(\"Skipping prototype\
        \ page conversion: An XPage with name '${protoTypePage.name}' already exists\
        \ in the repository\")\r\n                                        return null\r\
        \n                                    }\r\n\r\n                          \
        \          // Also check if the node exists directly in the XPages container\
        \ node\r\n                                    if (xPages != null && xPages.xPagesContainerNode\
        \ != null &&\r\n                                            xPages.xPagesContainerNode.hasNode(protoTypePage.name))\
        \ {\r\n                                        log.info(\"Skipping prototype\
        \ page conversion: An XPage node with name '${protoTypePage.name}' already\
        \ exists in the repository\")\r\n                                        return\
        \ null\r\n                                    }\r\n\r\n                  \
        \                  return new XPage(protoTypePage)\r\n                   \
        \             } catch (Exception e) {\r\n                                \
        \    log.warn(\"Failed to convert prototype page to XPage: ${protoTypePage?.name}\"\
        , e)\r\n                                    return null\r\n              \
        \                  }\r\n                            })\r\n               \
        \             .filter({ xPage -> xPage != null }) // Filter out skipped and\
        \ failed conversions\r\n                            .collect(Collectors.toMap(\r\
        \n                                    { e -> e.name },\r\n               \
        \                     { e -> e },\r\n                                    //\
        \ Merge function to handle duplicate keys\r\n                            \
        \        (existing, replacement) -> {\r\n                                \
        \        log.warn(\"Duplicate XPage name found: ${existing.name}. Using the\
        \ first occurrence.\")\r\n                                        return existing\r\
        \n                                    }\r\n                            ))\r\
        \n\r\n                    log.info(\"Successfully mapped ${xpagesFromPrototypePages.size()}\
        \ prototype pages to XPages\")\r\n\r\n                    if (xPages != null\
        \ && xPages.getXPages() != null) {\r\n                        xPages.getXPages().putAll(xpagesFromPrototypePages)\r\
        \n                        try {\r\n                            xPages.createXPagesFromPrototypePages(false)\r\
        \n                        } catch (Exception e) {\r\n                    \
        \        log.error(\"Error while creating XPages from prototype pages\", e)\r\
        \n                        }\r\n                    } else {\r\n          \
        \              log.error(\"XPages container is null or invalid, cannot add\
        \ XPages\")\r\n                    }\r\n                } else {\r\n     \
        \               log.warn(\"No prototype pages found to convert\")\r\n    \
        \            }\r\n            } catch (Exception e) {\r\n                log.error(\"\
        Error in convertPrototypeToXPageTemplateNodes\", e)\r\n            }\r\n \
        \           log.info(\"Step 1 - end\")\r\n        }\r\n\r\n        void createSitemapWildCards()\
        \ {\r\n            log.info(\"Step 2a - Iterate through workspace to get all\
        \ sitemap items\")\r\n            OptionalInt maxDepth = workspace.siteMap.getAllSiteMapItems().stream()\r\
        \n                    .filter({ siteMapItem -> !siteMapItem.isWildcard })\r\
        \n                    .mapToInt({ siteMapItem -> siteMapItem.depth })\r\n\
        \                    .max()\r\n            log.debug(\"Maximum depth of sitemap\
        \ items in the workspace: \" + maxDepth.orElse(-1))\r\n            if (maxDepth.isPresent())\
        \ {\r\n                log.info(\"Step 2b - based on the Maximum Depth create\
        \ the _default_ sitemap items (outside of the workspace) with the xpage folder\
        \ name: \" + xPageFolder)\r\n                createDevSiteMap(this, maxDepth.getAsInt())\r\
        \n                if (hstConfigNode.hasNode(\"hst:sitemap\")) {\r\n      \
        \              Node siteMapContainer = hstConfigNode.getNode(\"hst:sitemap\"\
        )\r\n\r\n                    // Iterate through sitemap items that are XPage\
        \ sitemap items\r\n                    for (SiteMapItem siteMapItem : siteMap.siteMapItems)\
        \ {\r\n                        if (siteMapItem.xPageSiteMapItem) {\r\n   \
        \                         try {\r\n                                siteMapItem.toNode(siteMapContainer)\r\
        \n                            } catch (RepositoryException e) {\r\n      \
        \                          log.error(\"Error persisting the default wildcard\
        \ sitemap items outside of the workspace\", e)\r\n                       \
        \     }\r\n                        }\r\n                    }\r\n        \
        \        }\r\n            }\r\n            log.info(\"Step 2 - end\")\r\n\
        \        }\r\n\r\n        private void createDevSiteMap(final HstConfiguration\
        \ hstConfiguration, final int maxDepth) {\r\n            final List<SiteMapItem>\
        \ siteMapItems = hstConfiguration.siteMap.siteMapItems\r\n            SiteMapItem\
        \ current = null\r\n            for (int i = 0; i < maxDepth; i++) {\r\n \
        \               if (current == null) {\r\n                    // Create and\
        \ add the root _default_ item\r\n                    current = new SiteMapItem(\"\
        _default_\", xPageFolder + \"/\\${1}\")\r\n                    siteMapItems.add(current)\r\
        \n                    // Create and add the root _any_ item\r\n          \
        \          siteMapItems.add(new SiteMapItem(\"_any_\", xPageFolder + \"/\\\
        ${1}\"))\r\n                } else {\r\n                    // Create and\
        \ add the next level _default_ item and _index_ item\r\n                 \
        \   final SiteMapItem currentNextLevel = new SiteMapItem(\"_default_\", \"\
        \\${parent}/\\${\" + (i + 1) + \"}\")\r\n                    current.siteMapItems.add(currentNextLevel)\r\
        \n                    current.siteMapItems.add(new SiteMapItem(\"_index_\"\
        , \"\\${parent}/index\"))\r\n                    // Move to next level for\
        \ next iteration\r\n                    current = currentNextLevel\r\n   \
        \             }\r\n            }\r\n            log.info(\"populated the (default)\
        \ sitemap with sitemap items\")\r\n        }\r\n    }\r\n\r\n    private class\
        \ SiteMap {\r\n\r\n        List<SiteMapItem> siteMapItems = new ArrayList<>()\r\
        \n        Workspace workspace\r\n        HstConfiguration hstConfiguration\r\
        \n        String path\r\n\r\n        SiteMap(Workspace workspace, Node node)\
        \ throws RepositoryException {\r\n            this.workspace = workspace\r\
        \n            init(node)\r\n        }\r\n\r\n        SiteMap(HstConfiguration\
        \ hstConfiguration, Node node) throws RepositoryException {\r\n          \
        \  this.hstConfiguration = hstConfiguration\r\n            init(node)\r\n\
        \        }\r\n\r\n        void init(Node node) throws RepositoryException\
        \ {\r\n            this.path = node.getPath()\r\n            final NodeIterator\
        \ it = node.getNodes()\r\n            while (it.hasNext()) {\r\n         \
        \       final Node siteMapItemNode = it.nextNode()\r\n                SiteMapItem\
        \ siteMapItem = new SiteMapItem(this, siteMapItemNode)\r\n               \
        \ siteMapItems.add(siteMapItem)\r\n            }\r\n        }\r\n\r\n    \
        \    List<SiteMapItem> getAllSiteMapItems() {\r\n            return siteMapItems.stream()\r\
        \n                    .flatMap(new Function<SiteMapItem, Stream<? extends\
        \ SiteMapItem>>() {\r\n                        @Override\r\n             \
        \           Stream<? extends SiteMapItem> apply(final SiteMapItem siteMapItem)\
        \ {\r\n                            return siteMapItem.flattened()\r\n    \
        \                    }\r\n                    })\r\n                    .collect(Collectors.toList())\r\
        \n        }\r\n\r\n        @Override\r\n        String toString() {\r\n  \
        \          return \"SiteMap{\" +\r\n                    \"siteMapItems=\"\
        \ + siteMapItems +\r\n                    \", path='\" + path + '\\'' +\r\n\
        \                    '}'\r\n        }\r\n    }\r\n\r\n    private class SiteMapItem\
        \ implements ToNode {\r\n\r\n        Map<String, Property> propertyMap = new\
        \ HashMap<>()\r\n        List<SiteMapItem> siteMapItems = new ArrayList<>()\r\
        \n        String relativeContentPath\r\n        String name\r\n        String\
        \ pageTitle\r\n        Page page\r\n        SiteMap siteMap\r\n        Node\
        \ documentHandle\r\n        String relativeSitemapPath\r\n        String path\r\
        \n        int depth\r\n        boolean isWildcard\r\n        List<String>\
        \ ignoreWithName = Arrays.asList(\"_default_\", \"_index_\", \"_any_\")\r\n\
        \        boolean xPageSiteMapItem\r\n\r\n        SiteMapItem(String name,\
        \ String relativeContentPath) {\r\n            this.name = name\r\n      \
        \      this.relativeContentPath = relativeContentPath\r\n            this.xPageSiteMapItem\
        \ = true\r\n        }\r\n\r\n        SiteMapItem(SiteMap siteMap, Node node)\
        \ throws RepositoryException {\r\n            if (node.hasProperty(\"hst:relativecontentpath\"\
        )) {\r\n                log.debug(\"Sitemap item relative content path \"\
        \ + node.getProperty(\"hst:relativecontentpath\").getString())\r\n       \
        \         node.setProperty(\"hst:relativecontentpath\", node.getProperty(\"\
        hst:relativecontentpath\").getString().replaceAll(\"^/\", \"\"))\r\n     \
        \       }\r\n\r\n            this.name = node.getName()\r\n            this.isWildcard\
        \ = ignoreWithName.stream().filter({ pattern -> name.contains(pattern) }).findAny().isPresent()\r\
        \n            this.path = node.getPath()\r\n            final String siteMapPath\
        \ = siteMap.path\r\n            this.relativeSitemapPath = path.replace(siteMapPath,\
        \ \"\")\r\n            this.depth = (int) relativeSitemapPath.chars().filter({\
        \ ch -> ch == '/' }).count()\r\n            final PropertyIterator pit = node.getProperties(\"\
        hst:*\")\r\n            while (pit.hasNext()) {\r\n                final Property\
        \ property = pit.nextProperty()\r\n                propertyMap.put(property.getName(),\
        \ property)\r\n            }\r\n            if (propertyMap.containsKey(\"\
        hst:componentconfigurationid\")) {\r\n                final Node configurationNode\
        \ = findClosestConfigurationParentNode(node)\r\n                final Node\
        \ pageNode = configurationNode.hasNode(propertyMap.get(\"hst:componentconfigurationid\"\
        ).getString()) ? configurationNode.getNode(propertyMap.get(\"hst:componentconfigurationid\"\
        ).getString()) : null\r\n                if (pageNode != null) {\r\n     \
        \               this.page = new Page(pageNode)\r\n                } else {\r\
        \n                    log.warn(\"Possible invalid sitemapitem component configuration\
        \ id: \" + node.getPath() + \" page does not exist with: \" + propertyMap.get(\"\
        hst:componentconfigurationid\").getString() + \" might be inherited!\")\r\n\
        \                }\r\n            }\r\n            if (propertyMap.containsKey(\"\
        hst:relativecontentpath\")) {\r\n                this.relativeContentPath\
        \ = propertyMap.get(\"hst:relativecontentpath\").getString()\r\n         \
        \       final Node siteBaseNode = siteMap.workspace != null ? siteMap.workspace.hstConfiguration.getSiteBaseNode()\
        \ : siteMap.hstConfiguration.getSiteBaseNode()\r\n                if (siteBaseNode.hasNode(relativeContentPath))\
        \ {\r\n                    documentHandle = siteBaseNode.getNode(relativeContentPath)\r\
        \n                }\r\n            }\r\n            if (propertyMap.containsKey(\"\
        hst:pagetitle\")) {\r\n                this.pageTitle = propertyMap.get(\"\
        hst:pagetitle\").getString()\r\n            }\r\n            final NodeIterator\
        \ it = node.getNodes()\r\n            while (it.hasNext()) {\r\n         \
        \       final Node sitemapItemNode = it.nextNode()\r\n                SiteMapItem\
        \ siteMapItem = new SiteMapItem(siteMap, sitemapItemNode)\r\n            \
        \    siteMapItems.add(siteMapItem)\r\n            }\r\n\r\n        }\r\n\r\
        \n        Stream<SiteMapItem> flattened() {\r\n            return Stream.concat(\r\
        \n                    Stream.of(this),\r\n                    siteMapItems.stream().flatMap(new\
        \ Function<SiteMapItem, Stream<? extends SiteMapItem>>() {\r\n           \
        \             @Override\r\n                        Stream<? extends SiteMapItem>\
        \ apply(final SiteMapItem siteMapItem) {\r\n                            return\
        \ siteMapItem.flattened()\r\n                        }\r\n               \
        \     }))\r\n        }\r\n\r\n        Node findClosestConfigurationParentNode(Node\
        \ node) throws RepositoryException {\r\n            if (node.isNodeType(\"\
        hst:workspace\") || node.isNodeType(\"hst:configuration\")) {\r\n        \
        \        return node\r\n            }\r\n            return findClosestConfigurationParentNode(node.getParent())\r\
        \n        }\r\n\r\n        @Override\r\n        String toString() {\r\n  \
        \          return \"SiteMapItem{\" +\r\n                    \"relativeContentPath='\"\
        \ + relativeContentPath + '\\'' +\r\n                    \", name='\" + name\
        \ + '\\'' +\r\n                    \", path='\" + path + '\\'' +\r\n     \
        \               \", depth=\" + depth +\r\n                    \", isWildcard=\"\
        \ + isWildcard +\r\n                    \", xPageSiteMapItem=\" + xPageSiteMapItem\
