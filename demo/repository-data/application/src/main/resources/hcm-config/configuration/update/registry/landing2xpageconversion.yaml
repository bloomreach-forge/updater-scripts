        \n                            log.info(\"Creating/getting XPage folder structure...\"\
        )\r\n                            Node xPageFolder = getOrCreateDeepestXpageFolder(siteBaseNode,\
        \ PathUtils.normalizePath(siteMapItem.relativeSitemapPath));\r\n         \
        \                   log.info(\"XPage folder \" + (xPageFolder ? \"created\
        \ at: \" + xPageFolder.getPath() : \"creation FAILED\"))\r\n\r\n         \
        \                   log.info(\"Saving session...\")\r\n                  \
        \          session.save();\r\n                            log.info(\"Session\
        \ saved successfully\")\r\n\r\n                            log.info(\"Getting\
        \ current landing page...\")\r\n                            final Page currentLandingPage\
        \ = siteMapItem.page\r\n                            log.info(\"Landing page\
