        \n            log.info(\"Total sitemap items found: \" + allSiteMapItems.size())\r\
        \n\r\n            def filteredItems = allSiteMapItems.stream()\r\n       \
        \             .filter({ siteMapItem -> siteMapItem.relativeContentPath ==\
