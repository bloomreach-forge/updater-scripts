      hipposys:query: hst:bloomreach/hst:configurations
      hipposys:script: "package org.bloomreach.cms.scripts\r\n\r\nimport org.apache.commons.lang3.RandomStringUtils\r\
        \nimport org.apache.commons.lang3.StringUtils\r\nimport org.hippoecm.hst.configuration.model.HstNode\r\
        \nimport org.hippoecm.hst.platform.configuration.cache.HstNodeImpl\r\nimport\
        \ org.hippoecm.hst.platform.configuration.components.JcrTemplateNodeConverter\r\
        \nimport org.hippoecm.hst.util.PathUtils\r\nimport org.hippoecm.repository.api.HippoWorkspace\r\
        \nimport org.hippoecm.repository.api.WorkflowException\r\nimport org.hippoecm.repository.standardworkflow.FolderWorkflow\r\
        \nimport org.hippoecm.repository.standardworkflow.JcrTemplateNode\r\nimport\
        \ org.onehippo.repository.documentworkflow.DocumentHandle\r\nimport org.onehippo.repository.documentworkflow.DocumentVariant\r\
        \nimport org.onehippo.repository.documentworkflow.DocumentWorkflow\r\nimport\
        \ org.onehippo.repository.update.BaseNodeUpdateVisitor\r\n\r\nimport javax.jcr.*\r\
        \nimport java.rmi.RemoteException\r\nimport java.util.function.Function\r\n\
        import java.util.stream.Collectors\r\nimport java.util.stream.Stream\r\n\r\
        \n/**\r\n * Script to convert landing pages to XPages in a given HST configuration.\r\
        \n *\r\n * Parameters:\r\n * - hstConfiguration: The name of the HST configuration\
        \ to process.\r\n * - xPageFolder: The folder name where XPages will be created\
        \ (default: \"xpages\").\r\n * - defaultXpageDocType: The document type for\
        \ the created XPages.\r\n * - publishPages: Whether to publish the pages after\
        \ conversion (default: false).\r\n */\r\n\r\nclass LandingPage2XPageConversionScriptGroovy\
        \ extends BaseNodeUpdateVisitor {\r\n\r\n    String hstConfiguration\r\n \
        \   String xPageFolder\r\n    String defaultXpageDocType\r\n    String publishPages\r\
        \n\r\n    void initialize(Session session) {\r\n        hstConfiguration =\
        \ (String) parametersMap.get(\"hstConfiguration\")\r\n        xPageFolder\
        \ = (String) parametersMap.getOrDefault(\"xPageFolder\", \"xpages\")\r\n \
        \       defaultXpageDocType = (String) parametersMap.get(\"defaultXpageDocType\"\
        )\r\n        publishPages = (Boolean) parametersMap.getOrDefault(\"publishPages\"\
        , true)\r\n        if (StringUtils.isEmpty(hstConfiguration)) {\r\n      \
        \      log.error(\"hstConfiguration property is empty\")\r\n            throw\
        \ new RuntimeException(\"hstConfiguration property is empty\")\r\n       \
        \ }\r\n        if (StringUtils.isEmpty(defaultXpageDocType)) {\r\n       \
        \     log.error(\"defaultXpageDocType property is empty\")\r\n           \
        \ throw new RuntimeException(\"defaultXpageDocType property is empty\")\r\n\
        \        }\r\n        log.info(\"starting the landing 2 xpage conversion script\
        \ with configuration\" +\r\n                \" hstConfiguration=\" + hstConfiguration\
        \ +\r\n                \", xPageFolder=\" + xPageFolder +\r\n            \
        \    \", defaultXpageDocType=\" + defaultXpageDocType +\r\n              \
        \  \", publishPages=\" + publishPages)\r\n    }\r\n\r\n    @Override\r\n \
        \   boolean doUpdate(final Node node) throws RepositoryException {\r\n   \
        \     if (node.isNodeType(\"hst:configurations\")) {\r\n            if (node.hasNode(hstConfiguration))\
        \ {\r\n                final NodeIterator it = node.getNodes(hstConfiguration)\r\
        \n                while (it.hasNext()) {\r\n                    final Node\
        \ configuration = it.nextNode()\r\n                    if (configuration.isNodeType(\"\
        hst:configuration\")) {\r\n                        log.info(\"Initializing\
        \ the in-memory channel configuration model\")\r\n                       \
        \ HstConfiguration hstConfig = new HstConfiguration(configuration)\r\n   \
        \                     hstConfig.startConversion()\r\n                    }\r\
        \n                }\r\n            }\r\n        }\r\n        return true\r\
        \n    }\r\n\r\n    @Override\r\n    boolean undoUpdate(final Node node) throws\
        \ RepositoryException, UnsupportedOperationException {\r\n        return false\r\
        \n    }\r\n\r\n\r\n    interface ToNode {\r\n        void toNode(Node container)\
        \ throws RepositoryException;\r\n    }\r\n\r\n    private class HstConfiguration\
        \ {\r\n\r\n        final ProtoTypePages protoTypePages\r\n        final Workspace\
        \ workspace\r\n        final SiteMap siteMap\r\n        final XPages xPages\r\
        \n        final String name\r\n        final String path\r\n        final\
        \ Node hst\r\n        final Node hstConfigNode\r\n        final Pages pages\r\
        \n        final Session session;\r\n\r\n        HstConfiguration(Node hstConfiguration)\
        \ throws RepositoryException {\r\n            this.hstConfigNode = hstConfiguration\r\
        \n            this.session = hstConfigNode.getSession();\r\n            this.name\
        \ = hstConfiguration.getName()\r\n            this.path = hstConfiguration.getPath()\r\
        \n            this.hst = hstConfiguration.getParent().getParent()\r\n    \
        \        this.protoTypePages = hstConfiguration.hasNode(\"hst:prototypepages\"\
        ) ? new ProtoTypePages(hstConfiguration.getNode(\"hst:prototypepages\")) :\
        \ null\r\n            this.workspace = hstConfiguration.hasNode(\"hst:workspace\"\
        ) ? new Workspace(this, hstConfiguration.getNode(\"hst:workspace\")) : null\r\
        \n            this.siteMap = hstConfiguration.hasNode(\"hst:sitemap\") ? new\
        \ SiteMap(this, hstConfiguration.getNode(\"hst:sitemap\")) : null\r\n    \
        \        this.xPages = getOrCreateXPages(hstConfiguration)\r\n           \
        \ this.pages = hstConfiguration.hasNode(\"hst:pages\") ? new Pages(this, hstConfiguration.getNode(\"\
        hst:pages\")) : null\r\n\r\n        }\r\n\r\n        private XPages getOrCreateXPages(final\
        \ Node hstConfiguration) throws RepositoryException {\r\n            if (hstConfiguration.hasNode(\"\
        hst:xpages\")) {\r\n                return new XPages(hstConfiguration.getNode(\"\
        hst:xpages\"))\r\n            } else {\r\n                final Node xPageContainer\
        \ = hstConfiguration.addNode(\"hst:xpages\", \"hst:xpages\")\r\n         \
        \       return new XPages(xPageContainer)\r\n            }\r\n        }\r\n\
        \r\n        Node getSiteBaseNode() throws RepositoryException {\r\n      \
        \      String hstSite = \"hst:sites/\" + name\r\n            if (hst.hasNode(hstSite))\
        \ {\r\n                final Node site = hst.getNode(hstSite)\r\n        \
        \        if (site.hasProperty(\"hst:content\")) {\r\n                    return\
        \ site.getProperty(\"hst:content\").getNode()\r\n                }\r\n   \
        \         }\r\n            return null\r\n        }\r\n\r\n        void startConversion()\
        \ throws RepositoryException {\r\n            log.info(\"Starting conversion\
        \ of landing pages to XPages for \" + path)\r\n            executeStep0();\r\
        \n            session.save();\r\n            executeStep1();\r\n         \
        \   session.save();\r\n            executeStep2();\r\n            session.save();\r\
        \n            executeStep3();\r\n            session.save();\r\n         \
        \   executeStep4();\r\n            log.info(\"End conversion of landing pages\
        \ to XPages for \" + path)\r\n            //step5b cleanup all pages which\
        \ have no reference from the sitemapitems\r\n        }\r\n\r\n        Comparator<SiteMapItem>\
        \ getReverseDepthComparator() {\r\n            return new Comparator<SiteMapItem>()\
        \ {\r\n                @Override\r\n                int compare(final SiteMapItem\
        \ o1, final SiteMapItem o2) {\r\n                    return o2.depth <=> o1.depth;\r\
        \n                }\r\n            }\r\n        }\r\n\r\n        DocumentWorkflow\
        \ getDocumentWorflow(Node documentHandle) {\r\n            return (DocumentWorkflow)\
        \ ((HippoWorkspace) session.getWorkspace()).getWorkflowManager().getWorkflow(\"\
        default\", documentHandle);\r\n        }\r\n\r\n        FolderWorkflow getFolderWorkflow(Node\
        \ folder) {\r\n            return (FolderWorkflow) ((HippoWorkspace) session.getWorkspace()).getWorkflowManager().getWorkflow(\"\
        threepane\", folder)\r\n        }\r\n\r\n        private void applyXpageToDocument(Node\
        \ handleNode, documentXpageManageableComponents, xPageByPage) {\r\n      \
        \      log.debug(\"Starting applyXpageToDocument for handle: \" + handleNode.getPath())\r\
        \n            DocumentHandle handle = new DocumentHandle(handleNode)\r\n \
        \           handle.initialize()\r\n            final Map<String, DocumentVariant>\
        \ documents = handle.getDocuments()\r\n            log.debug(\"Found \" +\
        \ documents.size() + \" document variants\")\r\n\r\n            documents.entrySet()\r\
        \n                    .stream()\r\n                    .filter({ documentVariant\
        \ -> (\"draft\" != documentVariant.getKey()) })\r\n                    .forEach({\
        \ documentVariant ->\r\n                        log.debug(\"Processing document\
        \ variant: \" + documentVariant.getKey())\r\n                        final\
        \ Node documentNode = documentVariant.getValue().getNode()\r\n           \
        \             try {\r\n                            Node xpage\r\n        \
        \                    if (!documentNode.isNodeType(\"hst:xpagemixin\") && documentNode.canAddMixin(\"\
        hst:xpagemixin\")) {\r\n                                log.info(\"adding\
        \ pagemixin to document: \" + documentNode.getPath())\r\n                \
        \                documentNode.addMixin(\"hst:xpagemixin\")\r\n           \
        \                 }\r\n                            if (!documentNode.hasNode(\"\
        hst:xpage\")) {\r\n                                log.info(\"adding hst:xpage\
        \ to document: \" + documentNode.getPath())\r\n                          \
        \      xpage = documentNode.addNode(\"hst:xpage\", \"hst:xpage\")\r\n    \
        \                        } else {\r\n                                log.info(\"\
        getting hst:xpage from document: \" + documentNode.getPath())\r\n        \
        \                        xpage = documentNode.getNode(\"hst:xpage\")\r\n \
        \                               log.info(\"removing all underlying xpage configuration\
        \ \" + documentNode.getPath())\r\n                                final NodeIterator\
        \ it = xpage.getNodes()\r\n                                while (it.hasNext())\
        \ {\r\n                                    it.nextNode().remove()\r\n    \
        \                            }\r\n                            }\r\n\r\n  \
        \                          log.debug(\"Starting component processing for document:\
        \ \" + documentNode.getPath())\r\n                            log.debug(\"\
        Input manageable components count: \" + (documentXpageManageableComponents\
        \ != null ? documentXpageManageableComponents.size() : 0))\r\n\r\n       \
        \                     final List<ManageableComponent> componentList = documentXpageManageableComponents.stream()\r\
        \n                                    .map({ manageableComponent ->\r\n  \
        \                                      log.debug(\"Processing component with\
        \ identifier: \" + manageableComponent.identifier + \", name: \" + manageableComponent.name)\r\
        \n                                        final ManageableComponent copy =\
        \ new ManageableComponent(manageableComponent)\r\n                       \
        \                 String manageableComponentIdentifier = manageableComponent.identifier\r\
        \n                                        if (manageableComponentIdentifier\
        \ == null || manageableComponentIdentifier.isEmpty()) {\r\n              \
        \                              log.warn(\"Component identifier is empty, generating\
        \ a new UUID\")\r\n                                            manageableComponentIdentifier\
        \ = UUID.randomUUID().toString()\r\n                                     \
        \   }\r\n                                        copy.setName(manageableComponentIdentifier)\r\
        \n                                        String oldId = manageableComponentIdentifier\r\
        \n                                        copy.identifier = UUID.randomUUID().toString()\r\
        \n                                        log.debug(\"Created copy of component:\
        \ old id=\" + oldId + \", new id=\" + copy.identifier + \", name set to: \"\
        \ + copy.name)\r\n                                        return copy\r\n\
        \                                    }).collect(Collectors.toList())\r\n\r\
        \n                            log.debug(\"Created \" + componentList.size()\
        \ + \" component copies\")\r\n\r\n                            XPage documentXpage\
        \ = new XPage(xpage)\r\n                            documentXpage.manageableComponents\
        \ = componentList\r\n                            documentXpage.pageRef = xPageByPage.name\r\
        \n                            log.debug(\"Created XPage with pageRef: \" +\
        \ xPageByPage.name + \", assigned \" + componentList.size() + \" manageable\
        \ components\")\r\n\r\n                            log.debug(\"About to add\
        \ components to node: \" + xpage.getPath())\r\n                          \
        \  documentXpage.addToNode(xpage)\r\n                            log.debug(\"\
        Successfully added XPage components to node: \" + xpage.getPath())\r\n   \
        \                     } catch (RepositoryException e) {\r\n              \
        \              log.error(\"error while trying to convert a landing page to\
        \ xpage\", e)\r\n                        }\r\n                    })\r\n \
        \           log.debug(\"Completed applyXpageToDocument for handle: \" + handleNode.getPath())\r\
        \n        }\r\n\r\n        Node getOrCreateDeepestXpageFolder(Node siteBaseNode,\
        \ String path) throws RepositoryException {\r\n            boolean isTranslated\
        \ = siteBaseNode.isNodeType(\"hippotranslation:translated\");\r\n        \
        \    log.info(\"base folder is translated: \" + isTranslated);\r\n       \
        \     String locale = isTranslated ? siteBaseNode.getProperty(\"hippotranslation:locale\"\
        ).getString() : null;\r\n            Node xPageFolderNode;\r\n           \
        \ String[] folderType = ['new-document']\r\n            if (siteBaseNode.hasNode(xPageFolder))\
        \ {\r\n                log.info(\"root xpage folder does exits\")\r\n    \
        \            xPageFolderNode = siteBaseNode.getNode(xPageFolder);\r\n    \
        \            if (!xPageFolderNode.isNodeType(\"hippostd:folder\")) {\r\n \
        \                   log.info(\"removing root xpage folder\")\r\n         \
        \           xPageFolderNode.remove();\r\n                    return getOrCreateDeepestXpageFolder(siteBaseNode,\
        \ path);\r\n                }\r\n            } else {\r\n                log.info(\"\
        root xpage folder does not exits, creating now..\")\r\n                xPageFolderNode\
        \ = siteBaseNode.addNode(xPageFolder, \"hippostd:folder\");\r\n          \
        \      xPageFolderNode.setProperty(\"hippostd:foldertype\", folderType);\r\
        \n            }\r\n\r\n            translate(isTranslated, locale, xPageFolderNode);\r\
        \n\r\n            if (!xPageFolderNode.isNodeType(\"hippostd:xpagefolder\"\
        )) {\r\n                xPageFolderNode.addMixin(\"hippostd:xpagefolder\"\
        );\r\n                xPageFolderNode.setProperty(\"hippostd:channelid\",\
        \ hstConfiguration);\r\n            }\r\n\r\n            if (StringUtils.isNotEmpty(path)\
        \ && path.contains(\"/\")) {\r\n                final List<String> paths =\
        \ new ArrayList<>(Arrays.asList(path.split(\"/\")));\r\n                paths.remove(paths.size()\
        \ - 1);\r\n                for (String segment : paths) {\r\n            \
        \        if (xPageFolderNode.hasNode(segment)) {\r\n                     \
        \   Node temp = xPageFolderNode.getNode(segment);\r\n                    \
        \    if (temp.isNodeType(\"hippostd:folder\") && temp.isNodeType(\"hippostd:xpagefolder\"\
        )) {\r\n                            xPageFolderNode = temp;\r\n          \
        \              } else if (temp.isNodeType(\"hippo:handle\")) {\r\n       \
        \                     String id = RandomStringUtils.random(5, true, false);\r\
        \n                            String originalName = temp.getName();\r\n  \
        \                          String tempName = originalName + \"-\" + id;\r\n\
        \                            String originalTempPath = temp.getPath();\r\n\
        \                            String newTempPath = temp.getParent().getPath()\
        \ + tempName;\r\n                            session.move(originalTempPath,\
        \ newTempPath);\r\n                            xPageFolderNode = xPageFolderNode.addNode(segment,\
        \ \"hippostd:folder\");\r\n                            xPageFolderNode.setProperty(\"\
        hippostd:foldertype\", folderType);\r\n                            translate(isTranslated,\
        \ locale, xPageFolderNode);\r\n                            if (!xPageFolderNode.isNodeType(\"\
        hippostd:xpagefolder\")) {\r\n                                xPageFolderNode.addMixin(\"\
        hippostd:xpagefolder\");\r\n                                xPageFolderNode.setProperty(\"\
        hippostd:channelid\", hstConfiguration);\r\n                            }\r\
        \n                            session.move(newTempPath, xPageFolderNode.getPath()\
        \ + \"/index\");\r\n                            final Node index = xPageFolderNode.getNode(\"\
        index\");\r\n                            final NodeIterator it = index.getNodes();\r\
        \n                            while (it.hasNext()) {\r\n                 \
        \               final Node doc = it.nextNode();\r\n                      \
        \          if (doc.isNodeType(\"hippo:document\")) {\r\n                 \
        \                   rename(doc, \"index\");\r\n                          \
        \      }\r\n                            }\r\n                        }\r\n\
        \                    } else {\r\n                        xPageFolderNode =\
        \ xPageFolderNode.addNode(segment, \"hippostd:folder\");\r\n             \
        \           if (!xPageFolderNode.isNodeType(\"hippostd:xpagefolder\")) {\r\
        \n                            xPageFolderNode.addMixin(\"hippostd:xpagefolder\"\
        );\r\n                            xPageFolderNode.setProperty(\"hippostd:channelid\"\
        , hstConfiguration);\r\n                        }\r\n                    \
        \    translate(isTranslated, locale, xPageFolderNode);\r\n               \
        \     }\r\n                }\r\n            }\r\n            return xPageFolderNode;\r\
        \n        }\r\n\r\n        void translate(boolean isTranslated, String locale,\
        \ Node xPageFolderNode){\r\n            if(isTranslated){\r\n            \
        \    xPageFolderNode.addMixin(\"hippotranslation:translated\")\r\n       \
        \         xPageFolderNode.setProperty(\"hippotranslation:locale\", locale);\r\
        \n                xPageFolderNode.setProperty(\"hippotranslation:id\", UUID.randomUUID().toString());\r\
        \n            }\r\n        }\r\n\r\n        void rename(Node node, String\
        \ newName) throws RepositoryException {\r\n            session.move(node.getPath(),\
        \ node.getParent().getPath() + \"/\" + newName);\r\n        }\r\n\r\n    \
        \    private void createDevSiteMap(final HstConfiguration hstConfiguration,\
        \ final int maxDepth) {\r\n            final List<SiteMapItem> siteMapItems\
        \ = hstConfiguration.siteMap.siteMapItems\r\n            SiteMapItem current\
        \ = null\r\n            for (int i = 0; i < maxDepth; i++) {\r\n         \
        \       if (current == null) {\r\n                    current = new SiteMapItem(\"\
        _default_\", xPageFolder + \"/\\${\" + (i + 1) + \"}\")\r\n              \
        \      siteMapItems.add(current)\r\n                } else {\r\n         \
        \           final SiteMapItem currentNexLevel = new SiteMapItem(\"_default_\"\
        , \"\\${parent}/\\${\" + (i + 1) + \"}\")\r\n                    new SiteMapItem(\"\
        _default_\", \"\\${parent}/\\${\" + (i + 1) + \"}\")\r\n                 \
        \   current.siteMapItems.add(currentNexLevel)\r\n                    current.siteMapItems.add(new\
        \ SiteMapItem(\"_index_\", \"\\${parent}/index\"))\r\n                   \
        \ current = currentNexLevel\r\n                }\r\n            }\r\n    \
        \        log.info(\"populated the (default) sitemap with sitemap items\")\r\
        \n        }\r\n\r\n        void resetDocumentThroughWorkflow(DocumentWorkflow\
        \ documentWorkflow) {\r\n            documentWorkflow.obtainEditableInstance()\r\
        \n            documentWorkflow.commitEditableInstance()\r\n            if\
        \ (publishPages) {\r\n                documentWorkflow.publish(new Date())\r\
        \n            }\r\n        }\r\n\r\n        void executeStep3() {\r\n    \
        \        log.info(\"Step 3a - iterate through workspace to get all sitemap\
