definitions:
  config:
    /hippo:configuration/hippo:update/hippo:registry/VersionsCleaner:
      hipposys:description: "VersionsCleaner is a script that visits document nodes\
        \ and cleans up the version history.\r\nIt can retain retainCount number and\
        \ daysToKeep days of latest versions.\r\nFor each node, it checks all its\
        \ versions: if the age of the version is older than the daysToKeep and \r\n\
        there are more versions than retainCount, then it deletes the version."
      hipposys:script: "/*\r\n * Copyright 2015-2026 Bloomreach\r\n *\r\n * Licensed\
        \ under the Apache License, Version 2.0 (the \"License\");\r\n * you may not\
        \ use this file except in compliance with the License.\r\n * You may obtain\
        \ a copy of the License at\r\n *\r\n *   http://www.apache.org/licenses/LICENSE-2.0\r\
        \n *\r\n * Unless required by applicable law or agreed to in writing, software\r\
        \n * distributed under the License is distributed on an \"AS IS\" BASIS,\r\
        \n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\r\
        \n * See the License for the specific language governing permissions and\r\
        \n * limitations under the License.\r\n */\r\n\r\n/**\r\n * VersionsCleaner\
        \ is a script that visits document nodes and cleans up the version history.\r\
        \n * It can retain retainCount number and daysToKeep days of latest versions.\r\
        \n * For each node, it checks all its versions: if the age of the version\
        \ is older\r\n * than the daysToKeep and there are more versions than retainCount,\
        \ then it deletes the version.\r\n */\r\n\r\npackage org.hippoecm.frontend.plugins.cms.dev.updater\r\
        \n\r\nimport org.onehippo.repository.update.BaseNodeUpdateVisitor\r\n\r\n\
        import javax.jcr.Node\r\nimport javax.jcr.version.Version\r\nimport javax.jcr.version.VersionHistory\r\
        \nimport javax.jcr.version.VersionIterator\r\nimport javax.jcr.version.VersionManager\r\
        \n\r\n/**\r\n * Truncates the version history, retaining only the latest\r\
        \n * ${retainCount} versions.\r\n */\r\nclass VersionsCleaner extends BaseNodeUpdateVisitor\
        \ {\r\n\r\n  /** The default number of versions to retain.*/\r\n  int defaultRetainCount\
        \ = 2;\r\n  /** The default number of days to keep versions.*/\r\n  int defaultDaysToKeep\
        \ = 30;\r\n\r\n  /** The number of versions to retain. Must be at least 1.\
        \ */\r\n  int retainCount;\r\n  /** The number of days to keep versions. Must\
        \ be at least 1 to keep history or 0 in which case only retainCount is used.\
        \ */\r\n  int daysToKeep;\r\n\r\n  void initialize(Session session) {\r\n\
        \    retainCount = parametersMap.get(\"retainCount\", defaultRetainCount)\r\
        \n    daysToKeep = parametersMap.get(\"daysToKeep\", defaultDaysToKeep)\r\n\
        \    if (retainCount < 1) {\r\n      retainCount = 1\r\n    }\r\n    if (daysToKeep\
        \ < 0) {\r\n      daysToKeep = 0\r\n    }\r\n    log.info \"VersionsCleaner\
        \ initialized with parameters: { retainCount: ${retainCount}, daysToKeep:\
        \ ${daysToKeep} }\"\r\n\r\n  }\r\n\r\n  boolean skipCheckoutNodes() {\r\n\
        \    return true; // we're changing version history, not current content\r\
        \n  }\r\n\r\n  boolean doUpdate(Node node) {\r\n    if (node.getPrimaryNodeType().getName().startsWith(\"\
        hst:\")\r\n            || node.getPath().startsWith(\"/hippo:configuration/\"\
        )\r\n            || node.getPath().equals(\"/hippo:namespaces\")\r\n     \
        \       || node.getPath().startsWith(\"/hippo:namespaces/\")) {\r\n      log.debug\
        \ \"Skipping config node ${node.path}\"\r\n      return false\r\n    }\r\n\
        \    log.debug \"Updating node ${node.path}\"\r\n\r\n    // gather versions\r\
        \n    List versions = new ArrayList()\r\n    VersionManager versionManager\
        \ = node.getSession().getWorkspace().getVersionManager()\r\n    Version baseVersion\
        \ = versionManager.getBaseVersion(node.getPath())\r\n    VersionHistory versionHistory\
        \ = versionManager.getVersionHistory(node.getPath())\r\n    VersionIterator\
        \ allVersions = versionHistory.getAllVersions()\r\n    while (allVersions.hasNext())\
        \ {\r\n      Version version = allVersions.nextVersion()\r\n      Calendar\
        \ created = version.getCreated();\r\n      Calendar daysOld = Calendar.getInstance();\r\
        \n      daysOld.add(Calendar.DAY_OF_MONTH, -daysToKeep);\r\n      def labels\
        \ = versionHistory.getVersionLabels(version)\r\n      def isRevisionVariant\
        \ = labels.length != 0\r\n      if (created.before(daysOld)) {\r\n       \
        \ if (!version.getName().equals(\"jcr:rootVersion\") && !isRevisionVariant)\
        \ {\r\n          versions.add(version);\r\n        }\r\n      }\r\n    }\r\
        \n    // remove versions\r\n    int removeCount = versions.size() - retainCount\r\
        \n    boolean remove = removeCount > 0\r\n    if (remove) {\r\n      log.info\
        \ \"Removing ${removeCount} versions of node ${node.path}\"\r\n    }\r\n \
        \   while (removeCount > 0) {\r\n      Version version = versions.remove(0);\r\
        \n      versionHistory.removeVersion(version.getName())\r\n      removeCount--;\r\
        \n    }\r\n    return remove\r\n  }\r\n\r\n  boolean undoUpdate(Node node)\
        \ {\r\n    throw new UnsupportedOperationException('Updater does not implement\
        \ undoUpdate method')\r\n  }\r\n\r\n}"
      hipposys:loglevel: DEBUG
      hipposys:logtarget: REPOSITORY
